name: Build and release skill ZIP

# Every push to main builds cfbd-analyst.zip and publishes it as the release
# for the version in ./VERSION (creating tag vX.Y.Z if it doesn't exist yet,
# or refreshing that release's ZIP if it does). To ship a new version, bump
# VERSION and push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: echo "version=$(tr -d ' \n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Sanity checks
        run: |
          test -f cfbd-analyst/SKILL.md
          grep -q '^name: cfbd-analyst$' cfbd-analyst/SKILL.md
          python3 -m py_compile cfbd-analyst/scripts/cfbd.py
          if find cfbd-analyst -name '.cfbd_key' | grep -q .; then echo "key file found - refusing to ship"; exit 1; fi

      - name: Build ZIP (skill folder at top level, as Claude requires)
        run: |
          find cfbd-analyst -name '__pycache__' -prune -exec rm -rf {} +
          zip -r cfbd-analyst.zip cfbd-analyst
          unzip -l cfbd-analyst.zip

      - name: Publish release v${{ steps.v.outputs.version }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: .github/release-notes.md
          files: cfbd-analyst.zip
          make_latest: true

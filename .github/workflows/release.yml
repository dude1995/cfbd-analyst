name: Build and release

# Every push to main builds both deliverables and publishes them as the release
# for the version in ./VERSION (creating tag vX.Y.Z if needed, or refreshing
# that release's files). To ship a new version, bump VERSION and push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version
        id: v
        run: echo "version=$(tr -d ' \n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Check skill
        run: |
          test -f cfbd-analyst/SKILL.md
          grep -q '^name: cfbd-analyst$' cfbd-analyst/SKILL.md
          python3 -m py_compile cfbd-analyst/scripts/cfbd.py
          V=$(tr -d ' \n' < VERSION)
          test "$(node -p "require('./extension/manifest.json').version")" = "$V" || { echo "extension/manifest.json version must equal VERSION ($V)"; exit 1; }
          if find . -name '.cfbd_key' -not -path './.git/*' | grep -q .; then echo "key file found - refusing to ship"; exit 1; fi

      - name: Build skill ZIP (skill folder at top level, as Claude requires)
        run: |
          find cfbd-analyst -name '__pycache__' -prune -exec rm -rf {} +
          zip -r cfbd-analyst.zip cfbd-analyst
          unzip -l cfbd-analyst.zip

      - name: Build desktop extension (.mcpb)
        working-directory: extension
        run: |
          npm ci --no-audit --no-fund
          npm run pack
          mv ../dist/cfbd-data.mcpb ../cfbd-data.mcpb
          npx mcpb info ../cfbd-data.mcpb

      - name: Publish release v${{ steps.v.outputs.version }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: .github/release-notes.md
          files: |
            cfbd-analyst.zip
            cfbd-data.mcpb
          make_latest: true
